      - name: Scan source code with Semgrep
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan \
              --config p/javascript \
              --config https://raw.githubusercontent.com/semgrep/semgrep-rules/develop/javascript/lang/security/detect-child-process.yaml \
              --error \
              --metrics=off \
              .